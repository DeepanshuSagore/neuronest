name: neuronest

services:
  api:
    build: .
    image: neuronest:latest
    ports:
      - "${PORT:-8000}:8000"

    # Both paths the service writes to live under /data, so one volume covers
    # the index and the embedding cache. Named rather than bind-mounted: Docker
    # seeds an empty named volume from the image, which carries /data's
    # ownership across with it. A host bind mount arrives owned by root and the
    # container — running as uid 1001 by design — cannot write to it.
    volumes:
      - index:/data

    # Optional, and absent on a fresh clone. The service runs without it —
    # ingestion, retrieval and refusal are all local. A GROQ_API_KEY here is
    # what turns the retrieved passages into a written answer.
    env_file:
      - path: .env.local
        required: false

    restart: unless-stopped

volumes:
  index:
