[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "neuronest"
description = "A retrieval-augmented generation service that answers only from retrieved context."
readme = "README.md"
license = "MIT"
authors = [{ name = "Deepanshu Sagore", email = "deepanshusagore@gmail.com" }]
requires-python = ">=3.12,<3.13"
dynamic = ["version"]
# Runtime dependencies land in the phase that first needs them, so that a
# checkout at any commit installs exactly what that commit uses and no more.
dependencies = [
    "pydantic>=2.10",
    "pydantic-settings>=2.7",
    # Pure Python, so the runtime image needs no system libraries for PDFs, and
    # it exposes encryption state rather than only raising on it.
    "pypdf>=5.1",
    # The splitters alone, not the langchain metapackage: this is the only part
    # of LangChain the service uses. It still pulls langchain-core, so it is not
    # free — but the metapackage would add the agent framework and a long tail
    # of optional provider clients on top of it.
    "langchain-text-splitters>=0.3",
    # The default embedder, and by far the heaviest thing here: it pulls torch,
    # which is most of the runtime image phase 9 has to build. Local is the
    # default anyway because it keeps the eval sweeps in phases 12-15 free to
    # re-run and keeps the test suite offline and secret-free.
    # Floor is 6.x: get_sentence_embedding_dimension was renamed to
    # get_embedding_dimension there, and a resolver free to pick an older
    # release would call a method that does not exist yet.
    "sentence-transformers>=6.0",
    # Declared directly only to control where it comes from. torch already
    # arrives as a dependency of sentence-transformers, but on Linux its PyPI
    # wheel declares the entire CUDA runtime — cuda-toolkit, cudnn, nccl,
    # triton — for a GPU no container here will ever have. uv applies
    # [tool.uv.sources] to direct dependencies only, so redirecting torch to the
    # CPU index means naming it. Deliberately unpinned: the version is
    # sentence-transformers' business, the index is ours.
    "torch",
    # The hosted embedder that phase 15 measures the local one against. Optional
    # at runtime: a blank key disables it and nothing else changes. Pinned to
    # 2.x because the client moved to mistralai.client there and 1.x exported it
    # from the package root, so a resolver free to pick 1.x breaks the import.
    "mistralai>=2.9",
    # The vector store. Persistent and local: no account, no server to run, and
    # the index is a directory you can delete and rebuild.
    "chromadb>=1.0",
    # Generation. Optional the same way the hosted embedder is: a blank key
    # leaves ingestion, retrieval and refusal working and disables only the
    # answering step, which is what lets the test suite and the eval sweeps run
    # without a secret.
    "groq",
    "fastapi>=0.115",
    # The ASGI server the container runs. Standard extras bring the production
    # HTTP stack rather than uvicorn's minimal pure-Python fallback.
    "uvicorn[standard]>=0.34",
    # Required by FastAPI to parse multipart bodies; without it a file upload
    # fails at request time rather than at import, which is a confusing way to
    # discover a missing dependency.
    "python-multipart>=0.0.20",
]

[project.urls]
Repository = "https://github.com/DeepanshuSagore/neuronest"

[dependency-groups]
dev = [
    "mypy>=1.14",
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "ruff>=0.9",
]

[tool.hatch.version]
# One source of truth for the version: the package itself.
path = "src/neuronest/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/neuronest"]

# --- uv ---------------------------------------------------------------------
# The CPU build of torch is the same library with the CUDA runtime left out. It
# is what the container runs and what phase 20 deploys, and choosing it is the
# single biggest lever on image size — larger than every other optimisation in
# phase 9 combined.
#
# explicit = true confines this index to the packages that name it below. The
# PyTorch index mirrors a handful of unrelated packages, and left open it could
# answer for one of them, making a resolution depend on which index replied.

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
# Scoped to Linux: macOS wheels on PyPI are already CPU-only, so local
# development keeps the ordinary wheel and only the image changes.
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]

# --- ruff -------------------------------------------------------------------
# Same rule set as the sibling Ethara backend, so the two repos read as one
# person's work rather than two unrelated experiments.

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # import ordering
    "UP",   # pyupgrade — keep syntax current with the pinned Python
    "B",    # bugbear — real bug patterns, not style
    "C4",   # comprehension clarity
    "SIM",  # simplifications
    "RUF",  # ruff's own checks
]

[tool.ruff.lint.per-file-ignores]
# Tests assert on behaviour, not on line width.
"tests/*" = ["E501"]

# --- mypy -------------------------------------------------------------------
# Strict everywhere, including tests: a test that lies about its types is not
# evidence of anything. Untyped third-party libraries get a narrow, named
# override as they arrive rather than a blanket ignore_missing_imports, so the
# file stays an honest record of which dependencies ship no stubs.

[tool.mypy]
python_version = "3.12"
files = ["src", "tests", "eval"]
strict = true
warn_unreachable = true
extra_checks = true
# Without this, mypy reads a pydantic model as a bare class and misses both the
# generated __init__ signature and the field types — which is most of what
# there is to check in a settings module.
plugins = ["pydantic.mypy"]

# --- pytest -----------------------------------------------------------------

[tool.pytest.ini_options]
testpaths = ["tests"]
# Slow tests are excluded by default rather than merely labelled. They need
# model weights on disk or a live API key, so a default run stays offline,
# secret-free and fast — which is what lets phase 18 put the whole suite on
# every push. Run them deliberately with: uv run pytest -m slow
addopts = "-q --strict-markers --strict-config -m 'not slow'"
markers = [
    "slow: downloads model weights or calls a hosted API; excluded unless -m slow",
]

[tool.coverage.run]
source = ["src/neuronest"]
branch = true

[tool.coverage.report]
show_missing = true
exclude_also = [
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
]
